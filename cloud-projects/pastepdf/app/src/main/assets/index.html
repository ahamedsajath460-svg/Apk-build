<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Paste PDF</title>
<style>
:root{--bg:#fff;--panel:#fbf1f1;--line:#ecd6d6;--text:#1c1414;--mute:#8a7070;--ac:#d62828;--on:#fff}
body.red{--bg:#b4121b;--panel:#92101a;--line:#d9474f;--text:#fff;--mute:#f6c9cc;--ac:#fff;--on:#b4121b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Roboto,sans-serif}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 6px;display:flex;align-items:center;gap:8px}
h1{font-size:1.15rem;margin:0;flex:1}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;white-space:nowrap}
button.pr{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.pill{background:var(--panel);border-radius:99px;padding:4px 10px;font-size:.8rem;color:var(--mute)}
.tabs{display:flex;position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:4;background:var(--bg)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid var(--line);border-radius:0;color:var(--mute)}
.tabs .on{border-color:var(--ac);color:var(--text);font-weight:700}
.tb{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px}
.g{display:grid;gap:6px;padding:8px 14px}
.t{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel);border:2px solid transparent}
.t img{width:100%;height:100%;object-fit:cover;display:block}
.t.on{border-color:var(--ac)}
.t i{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:#0005;border:2px solid #fff;color:transparent;display:grid;place-items:center;font-style:normal;font-size:14px}
.t.on i{background:var(--ac);border-color:var(--ac);color:var(--on)}
.t b{position:absolute;left:4px;bottom:4px;background:#0009;color:#fff;font-size:11px;padding:1px 6px;border-radius:8px}
.t.bl:not(.on) img{filter:blur(14px);transform:scale(1.2)}
.em{text-align:center;color:var(--mute);padding:40px 24px;line-height:1.6}
h3{margin:14px 14px 0;font-size:.95rem;color:var(--mute)}
.row{display:flex;align-items:center;gap:6px;margin:8px 14px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.row div{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mute)}.row button{padding:7px 10px;font-size:.85rem}
.pb{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);z-index:6}
.pb div.w{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--ac);border-radius:99px;padding:0 18px}
#pi{flex:1;min-width:0;padding:14px 0;outline:none;overflow:hidden;white-space:nowrap;max-height:50px;-webkit-user-select:text;user-select:text}
#pi:empty:before{content:attr(data-ph);color:var(--mute)}
#hn{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;border-radius:99px;display:none}
#L{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#L .bx{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#L input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px}
#le{color:var(--ac);min-height:1.2em;font-size:.9rem}
body.red #le{color:#fff;font-weight:600}
#lh{color:var(--mute);font-size:.85rem}
#lf{background:none;border:0;color:var(--mute);font-size:.85rem}
#S{position:fixed;inset:0;z-index:26;background:#0007;display:none}
#S.open{display:block}
#S .sh{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;max-height:88vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.s{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:4px}.seg button{padding:7px 11px;font-size:.85rem;border-radius:8px}
.seg .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.sh .full{width:100%;margin-top:10px}
#V{position:fixed;inset:0;z-index:25;background:#000;display:none;flex-direction:column;color:#fff}
#V.open{display:flex}
.vt{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.vb{flex:1;min-height:0;display:flex;align-items:center;gap:4px;padding:0 4px calc(10px + env(safe-area-inset-bottom))}
.vb img{flex:1;min-width:0;height:100%;object-fit:contain}
.vb button{background:#fff2;color:#fff;border:0;font-size:1.6rem;padding:10px 12px}
.vt button{background:#fff2;color:#fff;border:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:14px;z-index:40;display:none;font-size:.9rem;max-width:90%;text-align:center}
.row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button svg{display:block}
.ib{width:40px;height:40px;padding:0;display:grid;place-items:center;border:0;background:transparent;border-radius:50%}
.t i svg{width:16px;height:16px}
#E{--eb:#202327;--ec:#15171a;--el:#2c3036;--et:#eceff3;--em:#8b929b;--ea:#e5484d;position:fixed;inset:0;z-index:24;background:var(--ec);display:none;flex-direction:column;color:var(--et)}
#E.open{display:flex;animation:ein .22s ease-out}
@keyframes ein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pin{from{opacity:0}to{opacity:1}}
#E button{color:var(--et)}
.et{display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--eb);border-bottom:1px solid var(--el)}
.et .tt{flex:1;min-width:0;display:flex;flex-direction:column;padding-left:2px}
.et .tt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem;font-weight:600;letter-spacing:.1px}
.et .tt span{font-size:.72rem;color:var(--em);margin-top:1px}
#E .ib:active{background:#ffffff1a}
#eu{display:none}
#E.editing #eu{display:grid}
#ee{display:flex;align-items:center;gap:6px;background:var(--el);border:0;border-radius:10px;padding:8px 13px;font-weight:600;font-size:.86rem;transition:background .2s,transform .1s}
#ee:active{transform:scale(.96)}
#E.editing #ee{background:var(--ea);color:#fff}
#ev{flex:1;min-height:0;overflow:auto;touch-action:pan-x pan-y;background:var(--ec)}
#pgs{width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 8px 90px}
.pg{position:relative;background:#fff;box-shadow:0 2px 4px #0006,0 10px 28px #0007;animation:pin .3s ease-out}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.pg .ov{touch-action:pan-x pan-y}
#E.tool .pg .ov{touch-action:none}
.zf{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:var(--eb);border:1px solid var(--el);border-radius:12px;overflow:hidden;transition:bottom .25s ease;box-shadow:0 6px 18px #0007;z-index:3}
#E.editing .zf{bottom:calc(98px + env(safe-area-inset-bottom))}
#E.editing.opt .zf{bottom:calc(150px + env(safe-area-inset-bottom))}
.zf button{width:40px;height:40px;padding:0;border:0;background:transparent;border-radius:0;display:grid;place-items:center;color:var(--em)}
.zf button+button{border-top:1px solid var(--el)}
.zf button:active{background:#ffffff1a;color:var(--et)}
#eo{display:flex;flex-direction:column;gap:8px;padding:0 14px;background:var(--eb);overflow:hidden;max-height:0;opacity:0;transition:max-height .2s ease,opacity .2s ease,padding .2s ease;border-top:1px solid transparent}
#E.opt #eo{max-height:56px;opacity:1;padding:8px 14px;border-top-color:var(--el)}
#E.opt2 #eo{max-height:150px}
#E.editing.opt2 .zf{bottom:calc(250px + env(safe-area-inset-bottom))}
#eo .lb{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--em);flex:none}
#eo .seg button{background:var(--el);border-color:transparent;color:var(--em);padding:6px 12px;min-width:34px}
#eo .seg .on{background:#ffffff24;color:#fff;border-color:transparent}
#tl{display:flex;overflow:hidden;max-height:0;padding:0 4px;background:var(--eb);transition:max-height .25s ease,padding .25s ease}
#E.editing #tl{max-height:90px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--el)}
#tl button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;background:transparent;border:0;border-radius:10px;color:var(--em);font-size:.64rem;letter-spacing:.1px;transition:background .15s,color .15s}
#tl button.on{background:#e5484d24;color:#ff7378}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #ffffff22;padding:0;flex:none;transition:transform .12s}
.sw.on{outline:2px solid #fff;outline-offset:2px;transform:scale(1.05)}
#eo .r{display:flex;align-items:center;gap:10px;overflow-x:auto;flex:none;scrollbar-width:none}
#eo .r::-webkit-scrollbar{display:none}
#eo.tx .r:first-child{gap:8px}
#eo.tx .sw{width:22px;height:22px}
#eo .tg{width:30px;height:30px;padding:0;border:0;border-radius:8px;background:var(--el);color:var(--em);display:grid;place-items:center;flex:none}
#eo .tg.on{background:#ffffff26;color:#fff}
#eo.tx .seg{gap:2px;flex:none}
#eo.tx .seg button{padding:0;width:28px;height:30px;display:grid;place-items:center;border-radius:8px}
#eo .vv{width:32px!important;background:transparent!important;border-color:transparent!important;color:var(--et)!important;font-size:.82rem;font-weight:600}
.fc{flex:none;width:66px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--el);border:1px solid transparent;border-radius:10px;color:var(--et);transition:background .15s,border-color .15s}
.fc b{font-size:1.2rem;line-height:1.15;font-weight:inherit}
.fc small{font-size:.58rem;color:var(--em);font-family:system-ui,sans-serif;font-weight:400;font-style:normal}
.fc.on{border-color:var(--ea);background:#e5484d1f}
.tbx{position:absolute;z-index:5;line-height:1.2}
.tbx .ed{display:block;min-width:1.5ch;min-height:1.2em;white-space:pre;outline:1.5px dashed var(--ea);outline-offset:5px;background:transparent;-webkit-user-select:text;user-select:text}
.tbx .ed:empty:before{content:'Type here';opacity:.35}
.tbx .ba{position:absolute;left:0;top:calc(100% + 14px);display:flex;gap:2px;background:var(--eb);border:1px solid var(--el);border-radius:10px;padding:3px;box-shadow:0 4px 14px #0008;line-height:1}
.tbx .ba button{width:34px;height:34px;padding:0;border:0;background:transparent;display:grid;place-items:center;color:var(--et);border-radius:8px}
.tbx .ba button+button{color:#ff7378}
#L .bx{align-items:center;text-align:center}
#lt{font-size:1.15rem}
#lh{min-height:1.2em}
#pad{width:min(76vw,290px);aspect-ratio:1;margin:6px auto;touch-action:none;-webkit-user-select:none;user-select:none}
#pad svg{width:100%;height:100%;display:block;touch-action:none}
#pad .ring{fill:none;stroke:var(--line);stroke-width:2.5;transition:stroke .15s}
#pad .in{fill:var(--mute);transition:fill .15s,r .15s}
#pad .a .ring{stroke:var(--ac)}
#pad .a .in{fill:var(--ac)}
#pad polyline{fill:none;stroke:var(--ac);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
#pad.err .a .ring{stroke:#ff3b30}#pad.err .a .in{fill:#ff3b30}#pad.err polyline{stroke:#ff3b30}
body.red #pad.err .a .ring{stroke:#ffd60a}body.red #pad.err .a .in{fill:#ffd60a}body.red #pad.err polyline{stroke:#ffd60a}
#pad.err{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head>
<body>
<header>
  <h1>Paste PDF</h1>
  <span class="pill" id="cnt">0/100</span>
  <button class="pr" id="ad">+ Add</button>
  <button id="gs" aria-label="Settings" class="ib" style="background:var(--panel);border-radius:10px"></button>
</header>
<div class="tabs">
  <button data-t="img" class="on">Images</button>
  <button data-t="pdf">PDFs</button>
  <button data-t="priv">Private</button>
</div>
<div id="main"></div>
<input type="file" id="fi" accept="image/*" multiple hidden>
<button class="pr" id="hn">Hide now</button>

<div class="pb"><div class="w"><span id="pico" style="display:grid"></span><div id="pi" contenteditable="true" data-ph="Long press here, then tap Paste" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div><button class="pr" id="pbtn" style="padding:7px 14px;margin-right:-10px">Paste</button></div></div>

<div id="S"><div class="sh" id="sh"></div></div>

<div id="V"><div class="vt"><span id="vc"></span><button id="vx">Close</button></div><div class="vb"><button id="vp" aria-label="Previous"></button><img id="vi" alt=""><button id="vn" aria-label="Next"></button></div></div>

<div id="E"><div class="et"><button class="ib" id="eb" aria-label="Back"></button><div class="tt"><b id="en"></b><span id="ep"></span></div><button class="ib" id="eu" data-a="undo" aria-label="Undo"></button><button id="ee"></button><button class="ib" id="em" aria-label="More"></button></div><div id="ev"><div id="pgs"></div></div><div class="zf" id="zf"></div><div id="eo"></div><div id="tl"></div></div>

<div id="L"><div class="bx">
  <h2 id="lt"></h2>
  <div id="lh"></div>
  <div id="pad"></div>
  <div id="le"></div>
  <button id="lc">Cancel</button>
  <button id="lf">Forgot pattern? Erase private data</button>
</div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const L=$('L'),PI=$('pi'),S=$('S');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cfg={theme:'white',blur:false,autolock:true,size:'a4',margin:14,q:.8,cols:3,savePdf:true,autoClear:true,pIdle:60,pLeave:true,pBlur:true,pCool:true,pWipe:0,pName:'Private',pAsk:false,pHide:false,pDel:0,rsPw:false,hint:'',...JSON.parse(localStorage.pp_cfg||'{}')};
let imgs=[],pdfs=[],tab='img',sel=new Set(),privOK=false,unl=false,dDone,urls={},last=Date.now();


/* ---------- icons (inline SVG) ---------- */
const IC={back:'<path d="M15 5l-7 7 7 7"/>',next:'<path d="M9 5l7 7-7 7"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',more:'<circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/>',dots:'<circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/>',cursor:'<path d="M5 3l14 8-6 1.5L11 19z"/>',hl:'<path d="M14.5 4.5l5 5L11 18l-5-1-1-5z"/><path d="M4 21h8"/>',pen:'<path d="M4 18c3-8 5-8 7-3s4 3 9-9"/>',text:'<path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/>',cmt:'<path d="M4 5h16v11H10l-4 4v-4H4z"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',er:'<path d="M4 16l9-9 6 6-6 6H8z"/><path d="M11 20h9"/>',undo:'<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 8h-3"/>',zin:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M11 8v6M8 11h6"/>',zout:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8 11h6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',clip:'<rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V3h6v2"/>'};
const ic=(n,z=22)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
IC.minus='<path d="M6 12h12"/>';IC.plus='<path d="M12 6v12M6 12h12"/>';IC.bold='<path d="M7 5h6a3.5 3.5 0 010 7H7zM7 12h7a3.5 3.5 0 010 7H7z"/>';IC.italic='<path d="M10 5h8M6 19h8M15 5l-5 14"/>';IC.trash='<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>';
$('gs').innerHTML=ic('gear',20);$('vp').innerHTML=ic('back',28);$('vn').innerHTML=ic('next',28);$('eb').innerHTML=ic('back',24);$('em').innerHTML=ic('more',22);$('eu').innerHTML=ic('undo',22);$('pico').innerHTML=ic('clip',18);

/* ---------- storage (IndexedDB, stays on the phone) ---------- */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('pastepdf',1);r.onupgradeneeded=()=>{r.result.createObjectStore('imgs',{keyPath:'id'});r.result.createObjectStore('pdfs',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const all=s=>tx(s,'readonly',st=>st.getAll()),put=(s,v)=>tx(s,'readwrite',st=>st.put(v)),del=(s,k)=>tx(s,'readwrite',st=>st.delete(k));

/* ---------- helpers ---------- */
let tt;function toast(m,ms=2400){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);if(ms)tt=setTimeout(()=>t.style.display='none',ms)}
const mb=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB';
const fd=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const url=m=>urls[m.id]||(urls[m.id]=URL.createObjectURL(m.blob));
const saveCfg=()=>localStorage.pp_cfg=JSON.stringify(cfg);
const vis=()=>imgs.filter(i=>(tab==='priv')===!!i.priv);
async function delImgs(list){for(const i of list){await del('imgs',i.id);if(urls[i.id]){URL.revokeObjectURL(urls[i.id]);delete urls[i.id]}}imgs=imgs.filter(i=>!list.includes(i));sel.clear()}
async function wipePriv(){await delImgs(imgs.filter(i=>i.priv));for(const p of pdfs.filter(p=>p.priv))await del('pdfs',p.id);pdfs=pdfs.filter(p=>!p.priv)}

/* ---------- locks (private space pattern + per-PDF pattern) ---------- */
async function hash(p,salt){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of salt+p)h=((h*33)^c.charCodeAt(0))>>>0;return'x'+h}
const chk=async(k,v)=>{const s=JSON.parse(localStorage[k]);return(await hash(v,s.salt))===s.h};
const savePw=async(k,v)=>{const salt=uid();localStorage[k]=JSON.stringify({salt,h:await hash(v,salt),pat:1})};
const DX=i=>50+100*(i%3),DY=i=>50+100*Math.floor(i/3);
let pat=[],drawing=false,onPat=null;
const PAD=$('pad');
PAD.innerHTML='<svg viewBox="0 0 300 300" id="psv"><polyline id="pln" points=""/>'+[...Array(9).keys()].map(i=>`<g class="d"><circle class="ring" cx="${DX(i)}" cy="${DY(i)}" r="30"/><circle class="in" cx="${DX(i)}" cy="${DY(i)}" r="9"/></g>`).join('')+'</svg>';
const PSV=$('psv');
function padDraw(tail){const pts=pat.map(i=>DX(i)+','+DY(i));if(tail&&pat.length)pts.push(tail[0]+','+tail[1]);$('pln').setAttribute('points',pts.join(' '));PSV.querySelectorAll('.d').forEach((g,i)=>g.classList.toggle('a',pat.includes(i)))}

pgs.forEach((p,i)=>{const a=3+3*i,c=`q ${p.w} 0 0 ${p.h} ${p.x} ${p.y} cm /Im Do Q`;

(p.an||[]).forEach((n,k)=>obj(p.ids[k],()=>push(n.u?`<< /Type /Annot /Subtype /Link /Rect [${n.r.join(' ')}] /Border [0 0 1] /C [0 0 1] /A << /S /URI /URI (${n.u}) >> >>`:`<< /Type /Annot /Subtype /Text /Rect [${n.r.join(' ')}] /Contents <${n.c}> /Name /Comment /C [1 0.8 0] /F 4 >>`)))});

(async()=>{try{[imgs,pdfs]=await Promise.all([all('imgs'),all('pdfs')])}catch(e){toast('Storage not available in this browser')}
if(cfg.pDel){const lim=Date.now()-cfg.pDel*864e5;await delImgs(imgs.filter(i=>i.priv&&i.t<lim));for(const p of pdfs.filter(p=>p.priv&&p.t<lim))await del('pdfs',p.id);pdfs=pdfs.filter(p=>!(p.priv&&p.t<lim))}
try{const o=JSON.parse(localStorage.pp_pv||'null');if(o&&!o.pat){localStorage.removeItem('pp_pv');localStorage.removeItem('pp_pf');setTimeout(()=>toast('Lock is now a pattern. Set a new private pattern',4000),600)}}catch(e){}
for(const q of pdfs)if(q.pw&&!q.pw.pat){delete q.pw;await put('pdfs',q)}
imgs.sort((a,b)=>a.t-b.t);render();
localStorage.removeItem('pp_pw');
navigator.storage&&navigator.storage.persist&&navigator.storage.persist()})();
</script>
</body>
</html>
